<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAWME | Creator & Company Marketplace Ethiopia</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: 'var(--bg)',
                        surface: 'var(--surface)',
                        'surface-2': 'var(--surface-2)',
                        line: 'var(--line)',
                        text: 'var(--text)',
                        'text-muted': 'var(--text-muted)',
                        gold: 'var(--gold)',
                        'gold-soft': 'var(--gold-soft)',
                        'gold-deep': 'var(--gold-deep)',
                        success: '#3FB68B',
                        warning: '#E0A82E',
                        danger: '#E5484D',
                        verified: '#3B9EFF'
                    },
                    fontFamily: {
                        serif: ['Fraunces', 'serif'],
                        sans: ['Manrope', 'Noto Sans Ethiopic', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Fraunces & Manrope & Noto Sans Ethiopic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0A0A0B;
            --surface: #121214;
            --surface-2: #19191C;
            --line: #2A2A2F;
            --text: #F5F1E6;
            --text-muted: #A09A8C;
            --gold: #D4AF37;
            --gold-soft: #F0D27A;
            --gold-deep: #9C7A1B;
            --gold-wash: rgba(212,175,55,0.10);
        }
        html.light {
            --bg: #FAF7F0;
            --surface: #FFFFFF;
            --surface-2: #F3EEE2;
            --line: #E4DCC8;
            --text: #15130E;
            --text-muted: #6B6455;
            --gold: #9A7410;
            --gold-soft: #B8912F;
            --gold-deep: #7A5A08;
            --gold-wash: rgba(154,116,16,0.08);
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Manrope', 'Noto Sans Ethiopic', sans-serif;
            font-size: 15px;
            overflow-x: hidden;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #F0D27A 0%, #D4AF37 50%, #9C7A1B 100%);
        }
        html.light .gold-gradient {
            background: linear-gradient(135deg, #B8912F 0%, #9A7410 50%, #7A5A08 100%);
        }
        .gold-text-gradient {
            background: linear-gradient(135deg, #F0D27A 0%, #D4AF37 50%, #9C7A1B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border { border-color: var(--line); }
        .gold-border:hover { border-color: var(--gold-deep); }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-deep); }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-gold selection:text-black">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 bg-surface/90 backdrop-blur-md border-b border-line">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="#/discover" class="flex items-center gap-2 group">
                    <div class="w-10 h-10 rounded-lg border border-gold/40 bg-surface-2 flex items-center justify-center font-serif text-xl font-bold text-gold group-hover:border-gold transition-colors">
                        H
                    </div>
                    <div>
                        <span class="font-serif text-lg font-bold tracking-wider text-text">HAWME</span>
                        <span class="block text-[9px] uppercase tracking-widest text-text-muted">Ethiopia</span>
                    </div>
                </a>
                <nav class="hidden md:flex items-center gap-1 ml-6 text-sm font-medium">
                    <a href="#/discover" class="nav-link px-3 py-2 rounded-lg text-text-muted hover:text-text hover:bg-surface-2 transition-colors" data-route="discover">Discover</a>
                    <a href="#/promotions" class="nav-link px-3 py-2 rounded-lg text-text-muted hover:text-text hover:bg-surface-2 transition-colors" data-route="promotions">Promotions</a>
                    <a href="#/challenges" class="nav-link px-3 py-2 rounded-lg text-text-muted hover:text-text hover:bg-surface-2 transition-colors" data-route="challenges">Challenges</a>
                    <a href="#/creators" class="nav-link px-3 py-2 rounded-lg text-text-muted hover:text-text hover:bg-surface-2 transition-colors" data-route="creators">Creators</a>
                    <a href="#/leaderboard" class="nav-link px-3 py-2 rounded-lg text-text-muted hover:text-text hover:bg-surface-2 transition-colors" data-route="leaderboard">Leaderboard</a>
                </nav>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- Theme Toggle -->
                <button id="themeToggleBtn" class="p-2 rounded-lg border border-line text-text-muted hover:text-text hover:bg-surface-2 transition-colors" title="Toggle Theme">
                    <i data-lucide="sun" class="w-4 h-4 hidden light-icon"></i>
                    <i data-lucide="moon" class="w-4 h-4 dark-icon"></i>
                </button>
                <!-- Language Toggle -->
                <button id="langToggleBtn" class="px-2.5 py-1.5 rounded-lg border border-line text-xs font-semibold text-text-muted hover:text-text hover:bg-surface-2 transition-colors">
                    EN / አማርኛ
                </button>
                <!-- Notifications Bell -->
                <div id="notifContainer" class="relative hidden">
                    <button id="notifBtn" class="p-2 rounded-lg border border-line text-text-muted hover:text-text hover:bg-surface-2 transition-colors relative">
                        <i data-lucide="bell" class="w-4 h-4"></i>
                        <span id="notifBadge" class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-danger text-[10px] text-white flex items-center justify-center font-bold hidden">0</span>
                    </button>
                    <div id="notifDropdown" class="absolute right-0 mt-2 w-80 bg-surface border border-line rounded-xl shadow-2xl hidden z-50 overflow-hidden">
                        <div class="p-3 border-b border-line flex items-center justify-between text-xs font-semibold">
                            <span>Notifications</span>
                            <button id="markAllReadBtn" class="text-gold hover:underline">Mark all read</button>
                        </div>
                        <div id="notifList" class="max-h-80 overflow-y-auto divide-y divide-line">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                </div>
                <!-- Auth Actions / Profile -->
                <div id="authNavArea" class="flex items-center gap-2">
                    <a href="#/login" class="px-4 py-2 text-xs font-semibold uppercase tracking-wider rounded-lg border border-gold-deep text-gold hover:bg-gold-wash transition-colors">Login</a>
                    <a href="#/signup" class="px-4 py-2 text-xs font-bold uppercase tracking-wider rounded-lg gold-gradient text-black hover:opacity-90 transition-opacity">Get Started</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main id="app" class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 pb-24 md:pb-12">
        <!-- Rendered view goes here -->
    </main>

    <!-- Mobile Bottom Navigation (Fixed) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-surface/95 backdrop-blur-md border-t border-line px-2 py-2 flex items-center justify-around text-xs font-medium">
        <a href="#/discover" class="mobile-nav-link flex flex-col items-center gap-1 text-text-muted p-1" data-route="discover">
            <i data-lucide="compass" class="w-5 h-5"></i>
            <span>Discover</span>
        </a>
        <a href="#/applications" class="mobile-nav-link flex flex-col items-center gap-1 text-text-muted p-1" data-route="applications">
            <i data-lucide="file-text" class="w-5 h-5"></i>
            <span>Deals</span>
        </a>
        <a href="#/creators" class="mobile-nav-link flex flex-col items-center gap-1 text-text-muted p-1" data-route="creators">
            <i data-lucide="users" class="w-5 h-5"></i>
            <span>Creators</span>
        </a>
        <a href="#/notifications" class="mobile-nav-link flex flex-col items-center gap-1 text-text-muted p-1 relative" data-route="notifications">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span>Alerts</span>
            <span id="mobileNotifDot" class="absolute top-1 right-3 w-2 h-2 rounded-full bg-danger hidden"></span>
        </a>
        <a href="#/profile" class="mobile-nav-link flex flex-col items-center gap-1 text-text-muted p-1" data-route="profile">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span>Profile</span>
        </a>
    </nav>

    <!-- Footer -->
    <footer class="bg-surface border-t border-line py-8 px-4 text-xs text-text-muted">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded border border-gold/40 bg-surface-2 flex items-center justify-center font-serif text-xs font-bold text-gold">H</div>
                <span class="font-serif font-bold text-text">HAWME Ethiopia</span>
                <span class="text-text-muted">© 2026</span>
            </div>
            <div class="flex flex-wrap items-center gap-6">
                <a href="#/terms" class="hover:text-text transition-colors">Terms of Service</a>
                <a href="#/privacy" class="hover:text-text transition-colors">Privacy Policy</a>
                <a href="#/escrow-policy" class="hover:text-text transition-colors">Escrow & Refund Policy</a>
            </div>
            <div class="text-[11px] text-text-muted/80 text-center md:text-right">
                Not affiliated with TikTok or ByteDance Ltd. Secured via Telebirr Escrow.
            </div>
        </div>
    </footer>

    <!-- Modals Container -->
    <div id="modalContainer"></div>

    <!-- Firebase SDKs & App Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, addDoc, query, where, orderBy, limit, startAfter, getCountFromServer, serverTimestamp, writeBatch, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const CONFIG = {
            firebase: {
                apiKey: "AIzaSyCayGcfnpCAGNDph3YTyEA9_KDdD2C5Fg0",
                authDomain: "my-tiktok-cbd6f.firebaseapp.com",
                databaseURL: "https://my-tiktok-cbd6f-default-rtdb.firebaseio.com",
                projectId: "my-tiktok-cbd6f",
                storageBucket: "my-tiktok-cbd6f.firebasestorage.app",
                messagingSenderId: "964441294320",
                appId: "1:964441294320:web:4c8da74a0cee8ed2644935",
                measurementId: "G-RYBWW6XB10"
            },
            supabase: {
                storageUrl: "https://akoddbuemubeorwfwonv.supabase.co/storage/v1",
                publishableKey: "sb_publishable_e433Ao5lccy9spSTVpMqOw_hw25ae_f",
                bucket: "campaign-images"
            },
            telebirr: {
                number: "0996350347",
                accountName: "Hanif"
            },
            banks: [
                "Commercial Bank of Ethiopia (CBE)", "Telebirr Wallet", "Bank of Abyssinia (BOA)", 
                "Awash Bank", "Dashen Bank", "Cooperative Bank of Oromia (Coop)", 
                "Hibret Bank", "Wegagen Bank", "Nib International Bank", "Zemen Bank"
            ],
            categories: [
                "Beauty & Skincare", "Tech & Gadgets", "Lifestyle & Vlog", 
                "Fashion & Style", "Gaming & Esports", "Food & Cooking"
            ],
            commissionRate: 0.10 // 10% platform commission
        };

        // Initialize Firebase
        const app = initializeApp(CONFIG.firebase);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // App Global State
        window.HAWME = {
            currentUser: null,
            userProfile: null,
            isAdmin: false,
            lang: localStorage.getItem('hawme_lang') || 'en',
            theme: localStorage.getItem('hawme_theme') || 'dark',
            // Export Firebase helpers for modular view logic
            auth, db, CONFIG,
            signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut,
            doc, getDoc, setDoc, updateDoc, collection, getDocs, addDoc, query, where, orderBy, limit, startAfter, getCountFromServer, serverTimestamp, writeBatch, runTransaction
        };

        // Theme & Language Initialization
        if (window.HAWME.theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
        }

        document.getElementById('themeToggleBtn').addEventListener('click', () => {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                window.HAWME.theme = 'light';
                localStorage.setItem('hawme_theme', 'light');
            } else {
                document.documentElement.classList.remove('light');
                document.documentElement.classList.add('dark');
                window.HAWME.theme = 'dark';
                localStorage.setItem('hawme_theme', 'dark');
            }
        });

        document.getElementById('langToggleBtn').addEventListener('click', () => {
            window.HAWME.lang = window.HAWME.lang === 'en' ? 'am' : 'en';
            localStorage.setItem('hawme_lang', window.HAWME.lang);
            alert(window.HAWME.lang === 'am' ? 'ቋንቋ ወደ አማርኛ ተቀይሯል' : 'Language switched to English');
            router();
        });

        // Supabase Upload Helper
        window.HAWME.uploadToSupabase = async (file, folder = 'offers') => {
            if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
                throw new Error("Invalid image type. Only JPEG, PNG, and WebP are allowed.");
            }
            if (file.size > 2 * 1024 * 1024) {
                throw new Error("File size exceeds 2 MB limit.");
            }
            const uid = window.HAWME.currentUser ? window.HAWME.currentUser.uid : 'anon';
            const ext = file.name.split('.').pop();
            const filename = `${folder}/${uid}/${Date.now()}_${Math.random().toString(36.substring(2, 8))}.${ext}`;
            const uploadUrl = `${CONFIG.supabase.storageUrl}/object/${CONFIG.supabase.bucket}/${filename}`;

            const response = await fetch(uploadUrl, {
                method: 'POST',
                headers: {
                    'apikey': CONFIG.supabase.publishableKey,
                    'Authorization': `Bearer ${CONFIG.supabase.publishableKey}`,
                    'Content-Type': file.type
                },
                body: file
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Upload failed: ${errText}`);
            }

            return `${CONFIG.supabase.storageUrl}/object/public/${CONFIG.supabase.bucket}/${filename}`;
        };

        // Authentication & Session Observer
        onAuthStateChanged(auth, async (user) => {
            const notifContainer = document.getElementById('notifContainer');
            const authNavArea = document.getElementById('authNavArea');
            
            if (user) {
                window.HAWME.currentUser = user;
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    window.HAWME.userProfile = userDoc.data();
                } else {
                    // Google sign-in without existing profile -> Prompt profile completion modal
                    showProfileCompletionModal(user);
                }

                // Check Admin privilege
                const adminDocRef = doc(db, "admins", user.uid);
                const adminDoc = await getDoc(adminDocRef);
                window.HAWME.isAdmin = adminDoc.exists();

                notifContainer.classList.remove('hidden');
                authNavArea.innerHTML = `
                    <a href="#/profile" class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-line bg-surface-2 hover:border-gold transition-colors">
                        <img src="${window.HAWME.userProfile?.avatar_url || `https://api.dicebear.com/7.x/initials/svg?seed=${user.email}`}" class="w-6 h-6 rounded-full object-cover">
                        <span class="text-xs font-semibold max-w-[100px] truncate">${window.HAWME.userProfile?.name || 'User'}</span>
                    </a>
                `;
                fetchNotificationsCount();
            } else {
                window.HAWME.currentUser = null;
                window.HAWME.userProfile = null;
                window.HAWME.isAdmin = false;
                notifContainer.classList.add('hidden');
                authNavArea.innerHTML = `
                    <a href="#/login" class="px-4 py-2 text-xs font-semibold uppercase tracking-wider rounded-lg border border-gold-deep text-gold hover:bg-gold-wash transition-colors">Login</a>
                    <a href="#/signup" class="px-4 py-2 text-xs font-bold uppercase tracking-wider rounded-lg gold-gradient text-black hover:opacity-90 transition-opacity">Get Started</a>
                `;
            }
            lucide.createIcons();
            router();
        });

        function showProfileCompletionModal(user) {
            const modalContainer = document.getElementById('modalContainer');
            modalContainer.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                    <div class="bg-surface border border-line rounded-2xl max-w-md w-full p-6 shadow-2xl">
                        <h3 class="font-serif text-xl font-bold mb-2">Complete Your Profile</h3>
                        <p class="text-xs text-text-muted mb-4">Welcome to HAWME! Please finish setting up your creator or company profile.</p>
                        <form id="completeProfileForm" class="space-y-4">
                            <div>
                                <label class="block text-xs uppercase font-bold text-text-muted mb-1">Account Role</label>
                                <select name="role" class="w-full bg-surface-2 border border-line rounded-xl px-3 py-2 text-sm focus:border-gold outline-none">
                                    <option value="creator">TikTok Creator</option>
                                    <option value="company">Company / Brand</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs uppercase font-bold text-text-muted mb-1">Full Name / Brand Name</label>
                                <input type="text" name="name" value="${user.displayName || ''}" required class="w-full bg-surface-2 border border-line rounded-xl px-3 py-2 text-sm focus:border-gold outline-none">
                            </div>
                            <div>
                                <label class="block text-xs uppercase font-bold text-text-muted mb-1">TikTok Username (with @)</label>
                                <input type="text" name="tiktok_username" placeholder="@username" required class="w-full bg-surface-2 border border-line rounded-xl px-3 py-2 text-sm focus:border-gold outline-none">
                            </div>
                            <div id="creatorExtraFields">
                                <label class="block text-xs uppercase font-bold text-text-muted mb-1">Followers Count</label>
                                <input type="number" name="followers" placeholder="15000" class="w-full bg-surface-2 border border-line rounded-xl px-3 py-2 text-sm focus:border-gold outline-none">
                                <label class="block text-xs uppercase font-bold text-text-muted mt-3 mb-1">Content Category</label>
                                <select name="category" class="w-full bg-surface-2 border border-line rounded-xl px-3 py-2 text-sm focus:border-gold outline-none">
                                    ${CONFIG.categories.map(c => `<option value="${c}">${c}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs uppercase font-bold text-text-muted mb-1">Bio / Description</label>
                                <textarea name="bio" rows="2" class="w-full bg-surface-2 border border-line rounded-xl px-3 py-2 text-sm focus:border-gold outline-none"></textarea>
                            </div>
                            <button type="submit" class="w-full py-3 rounded-xl gold-gradient text-black font-bold text-sm uppercase tracking-wider hover:opacity-90 transition-opacity">Save Profile & Continue</button>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('completeProfileForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const role = fd.get('role');
                const profileData = {
                    role,
                    name: fd.get('name'),
                    email: user.email,
                    tiktok_username: fd.get('tiktok_username'),
                    followers: role === 'creator' ? Number(fd.get('followers')) || 0 : 0,
                    bio: fd.get('bio'),
                    category: role === 'creator' ? fd.get('category') : 'Brand',
                    completed_promotions: 0,
                    avatar_url: user.photoURL || `https://api.dicebear.com/7.x/initials/svg?seed=${fd.get('name')}`,
                    created_at: new Date().toISOString(),
                    verification_status: 'unverified',
                    verified: false,
                    payment_verified: false,
                    level: 'rising',
                    rating_avg: 5.0,
                    rating_count: 0,
                    available: true,
                    rate_card: [],
                    showcase: [],
                    referral_code: 'HW-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
                    referred_by: '',
                    banned: false,
                    lang: 'en'
                };

                await setDoc(doc(db, "users", user.uid), profileData);
                window.HAWME.userProfile = profileData;
                modalContainer.innerHTML = '';
                router();
            });
        }

        async function fetchNotificationsCount() {
            if (!window.HAWME.currentUser) return;
            try {
                const q = query(collection(db, "notifications"), where("user_id", "==", window.HAWME.currentUser.uid), where("read", "==", false));
                const snap = await getDocs(q);
                const count = snap.size;
                const badge = document.getElementById('notifBadge');
                const dot = document.getElementById('mobileNotifDot');
                if (count > 0) {
                    badge.textContent = count;
                    badge.classList.remove('hidden');
                    dot.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                    dot.classList.add('hidden');
                }
            } catch (err) {
                console.error("Error fetching notifications:", err);
            }
        }

        // Router & Page Handlers
        async function router() {
            const hash = window.location.hash || '#/discover';
            const appContainer = document.getElementById('app');
            
            // Highlight active nav
            document.querySelectorAll('.nav-link, .mobile-nav-link').forEach(el => {
                if (el.getAttribute('href') === hash || (hash.startsWith('#/offer') && el.getAttribute('href') === '#/discover')) {
                    el.classList.add('text-gold', 'font-bold');
                } else {
                    el.classList.remove('text-gold', 'font-bold');
                }
            });

            appContainer.innerHTML = `<div class="flex justify-center items-center py-24"><div class="w-8 h-8 border-2 border-gold border-t-transparent rounded-full animate-spin"></div></div>`;

            try {
                if (hash === '#/discover' || hash === '#/promotions' || hash === '#/challenges') {
                    await renderDiscover(appContainer, hash);
                } else if (hash.startsWith('#/offer/')) {
                    const id = hash.split('/')[2];
                    await renderOfferDetail(appContainer, id);
                } else if (hash === '#/creators') {
                    await renderCreators(appContainer);
                } else if (hash.startsWith('#/creator/')) {
                    const id = hash.split('/')[2];
                    await renderCreatorProfile(appContainer, id);
                } else if (hash === '#/leaderboard') {
                    await renderLeaderboard(appContainer);
                } else if (hash === '#/login') {
                    renderLogin(appContainer);
                } else if (hash === '#/signup') {
                    renderSignup(appContainer);
                } else if (hash === '#/dashboard') {
                    await renderDashboard(appContainer);
                } else if (hash === '#/applications') {

        async function loadOffersList(filters = {}) {
            const grid = document.getElementById('offersGrid');
            grid.innerHTML = Array(6).fill(0).map(() => `
                <div class="bg-surface border border-line rounded-2xl p-5 space-y-4 animate-pulse">
                    <div class="h-40 bg-surface-2 rounded-xl"></div>
                    <div class="h-5 bg-surface-2 rounded w-3/4"></div>
                    <div class="h-4 bg-surface-2 rounded w-1/2"></div>
                </div>
            `).join('');

            try {
                let q = collection(db, "campaigns");
                const snapshot = await getDocs(q);
                let campaigns = [];
                snapshot.forEach(docSnap => {
                    campaigns.push({ id: docSnap.id, ...docSnap.data() });
                });

                // Apply client-side filters
                const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
                const category = document.getElementById('categoryFilter')?.value || '';
                const sort = document.getElementById('sortFilter')?.value || 'newest';

                campaigns = campaigns.filter(c => {
                    if (filters.type && c.type !== filters.type) return false;
                    if (category && c.category !== category) return false;
                    if (search && !c.title.toLowerCase().includes(search) && !c.brand.toLowerCase().includes(search)) return false;
                    return true;
                });

                // Ranking: Payment Guaranteed first, then sort
                campaigns.sort((a, b) => {
                    if (a.payment_guaranteed && !b.payment_guaranteed) return -1;
                    if (!a.payment_guaranteed && b.payment_guaranteed) return 1;
                    if (sort === 'reward') return (b.reward_amount || 0) - (a.reward_amount || 0);
                    return new Date(b.created_at || 0) - new Date(a.created_at || 0);
                });

                if (campaigns.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-16 bg-surface border border-line rounded-2xl space-y-3">
                            <i data-lucide="package-open" class="w-12 h-12 text-text-muted mx-auto"></i>

                            <p class="text-xs text-text-muted">Try adjusting your search criteria or check back later.</p>

                grid.innerHTML = campaigns.map(c => `

                                    ${c.payment_guaranteed ? '<span class="px-2.5 py-1 rounded-full bg-success/90 backdrop-blur-md text-[10px] font-bold text-black flex items-center gap-1"><i data-lucide="shield-check" class="w-3 h-3"></i> Payment Guaranteed</span>' : ''}
                                </div>
                            </div>
                            <div class="p-5 space-y-3">
                                <div class="flex items-center justify-between text-xs text-text-muted">
                                    <span class="font-semibold text-text flex items-center gap-1">${c.brand} <i data-lucide="badge-check" class="w-3.5 h-3.5 text-verified"></i></span>
                                    <span>${c.category || 'General'}</span>
                                </div>
                                <h3 class="font-serif font-bold text-base line-clamp-2 group-hover:text-gold transition-colors">${c.title}</h3>
                                <div class="text-2xl font-bold font-serif gold-text-gradient">${c.reward}</div>

        function setupApplyHandler(campaignId, campaign) {
            const form = document.getElementById('applyForm');
            if (!form) return;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const profile = window.HAWME.userProfile;
                const fd = new FormData(e.target);
                const pitch = fd.get('pitch');

                try {
                    // Calculate match score
                    let score = 50;
                    if (profile.verified) score += 25;
                    if (profile.followers >= (campaign.min_followers || 0)) score += 25;

                    await addDoc(collection(db, "applications"), {
                        campaign_id: campaignId,
                        campaign_title: campaign.title,
                        company_owner_id: campaign.user_id,
                        creator_id: window.HAWME.currentUser.uid,
                        creator_name: profile.name,
                        creator_tiktok: profile.tiktok_username,
                        creator_followers: profile.followers,
                        pitch,
                        status: 'Pending',
                        match_score: score,
                        match_breakdown: `Verified: ${profile.verified ? 25 : 0}, Followers: ${profile.followers >= campaign.min_followers ? 25 : 0}`,
                        created_at: new Date().toISOString()
                    });

                    // Notification for company
                    await addDoc(collection(db, "notifications"), {
                        user_id: campaign.user_id,
                        message: `New application from ${profile.name} for "${campaign.title}"`,
                        read: false,
                        deal_id: campaignId,
                        created_at: new Date().toISOString(),
                        link: '#/my-offers',
                        type: 'application'
                    });

                    alert("Application submitted successfully!");
                    window.location.hash = '#/applications';
                } catch (err) {
                    console.error("Error submitting application:", err);
                    alert("Failed to submit application.");
                }
            });
        }

                                <label class="block text-xs uppercase font-bold text-text-muted mb-1">Full Name</label>
                                <input type="text" name="name" value="${profile?.name || ''}" required class="w-full bg-surface-2 border border-line rounded-xl px-3 py-2.5 text-sm focus:border-gold outline-none">
                            </div>
                            <div>
                                <label class="block text-xs uppercase font-bold text-text-muted mb-1">TikTok Username</label>
                                <input type="text" name="tiktok_username" value="${profile?.tiktok_username || ''}" required class="w-full bg-surface-2 border border-line rounded-xl px-3 py-2.5 text-sm focus:border-gold outline-none">
                            </div>
                            <div>
                                <label class="block text-xs uppercase font-bold text-text-muted mb-1">Bio</label>
                                <textarea name="bio" rows="3" class="w-full bg-surface-2 border border-line rounded-xl p-3 text-sm focus:border-gold outline-none">${profile?.bio || ''}</textarea>
                            </div>
                            <button type="submit" class="w-full py-3 rounded-xl gold-gradient text-black font-bold text-sm uppercase tracking-wider">Save Changes</button>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('editProfileForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                try {
                    await updateDoc(doc(db, "users", user.uid), {
                        name: fd.get('name'),
                        tiktok_username: fd.get('tiktok_username'),
                        bio: fd.get('bio')
                    });
                    alert("Profile updated successfully!");
                    window.location.reload();
                } catch (err) {
                    alert(`Failed to update profile: ${err.message}`);
                }
            });

            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await signOut(auth);
                window.location.hash = '#/discover';
            });
            lucide.createIcons();
        }

        function renderStaticLegal(container, hash) {
            const titles = { '#/terms': 'Terms of Service', '#/privacy': 'Privacy Policy', '#/escrow-policy': 'Escrow & Refund Policy' };
            container.innerHTML = `
                <div class="max-w-3xl mx-auto space-y-6 bg-surface border border-line rounded-3xl p-8">
                    <h1 class="font-serif text-3xl font-bold">${titles[hash]}</h1>
                    <p class="text-xs text-text-muted leading-relaxed">
                        Welcome to HAWME Ethiopia. By using our platform, you agree to secure Telebirr escrow transactions, verified campaign rules, and strict compliance with Ethiopian digital commerce guidelines. HAWME is an independent marketplace and is not affiliated with TikTok or ByteDance Ltd. All funds held in escrow are secured via account ${CONFIG.telebirr.number} (${CONFIG.telebirr.accountName}).
                    </p>
                    <a href="#/discover" class="inline-block px-5 py-2.5 rounded-xl gold-gradient text-black font-bold text-xs uppercase tracking-wider">Back to Discover</a>
                </div>
            `;
            lucide.createIcons();
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
    </script>
</body>
</html>
